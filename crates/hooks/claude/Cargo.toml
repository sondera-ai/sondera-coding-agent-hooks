[package]
name = "sondera-claude"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Sondera Team"]
description = "Claude Code hooks implementation for Sondera Agentic Security Platform"

[dependencies]
sondera-harness-client = { workspace = true }
sondera-hooks = { workspace = true }
sondera-types = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
dirs = { workspace = true }
chrono = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
