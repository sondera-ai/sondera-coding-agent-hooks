[package]
name = "sondera-vscode"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Sondera Team"]
description = "VS Code Copilot Chat hooks implementation for Sondera Agentic Security Platform"

[dependencies]
sondera-harness-client = { workspace = true }
sondera-hooks = { workspace = true }
sondera-types = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"] }
chrono = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
