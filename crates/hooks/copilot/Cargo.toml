[package]
name = "sondera-copilot"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Sondera Team"]
description = "GitHub Copilot hooks implementation for Sondera Agentic Security Platform"

[dependencies]
sondera-harness-client = { workspace = true }
sondera-hooks = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
dirs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
