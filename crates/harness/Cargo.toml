[package]
name = "sondera-harness"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Harness APIs for Agent Scaffolds"
authors.workspace = true
repository.workspace = true

[lib]
name = "sondera_harness"
crate-type = ["rlib"]

[features]
# `client` is the lightweight surface consumed by crates/hooks/*: domain types,
# the `HarnessClient` trait, and the gRPC `HarnessGrpcClient`. It deliberately
# pulls in none of the Cedar / Turso / Ollama engine dependencies.
#
# `server` is the generic gRPC server transport (the `rpc` module). It is
# engine-agnostic — it serves any `Harness` impl — so it does NOT pull in the
# engine. This keeps the transport (and its round-trip test) buildable without
# the heavy Cedar/Turso/Ollama/YARA stack.
#
# `engine` preserves the historical Cedar engine re-exports for embedders.
# New code can depend on `sondera-cedar-policy` directly.
# `scanner` adds the background trajectory scanner dispatched from the gRPC
# server. It is separate from `server` because it links the LLM provider stack
# through `sondera-trajectory`: a deployment that only enforces policy should
# not carry rig and its provider clients. The transport holds the dispatcher as
# a trait object, so turning this off changes no signature.
default = ["server", "engine", "scanner"]
client = []
server = ["client"]
scanner = ["server", "dep:sondera-trajectory"]
engine = ["dep:sondera-cedar-policy", "dep:sondera-storage"]
[dependencies]
# --- always available (client + server) ---
sondera-types = { workspace = true }
sondera-schema = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tonic = { workspace = true }

# --- background trajectory scanning (`scanner`) ---
sondera-trajectory = { workspace = true, optional = true }

# --- engine compatibility surface ---
sondera-cedar-policy = { workspace = true, optional = true }
sondera-storage = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
# The background-scan wiring tests run a stub scanner against a real in-memory
# store: what they assert is that the dispatcher persists to the right tables
# and appends the right ledger event, which a store mock could only restate.
sondera-storage = { workspace = true }

[lints]
workspace = true
