[package]
name = "sondera-schema"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Generated gRPC schema and domain ↔ proto conversions for the Sondera coding-agent harness"

[lib]
name = "sondera_schema"
crate-type = ["rlib"]

[dependencies]
sondera-types = { workspace = true }
chrono = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
serde_json = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
protoc-bin-vendored = { workspace = true }
tonic-prost-build = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }

[lints]
workspace = true
