[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unlicense",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]

[advisories]
ignore = [
    # Transitive via yara-x -> bincode (unmaintained, no fix available)
    "RUSTSEC-2025-0141",
    # Transitive via yara-x -> rsa (timing side-channel, no fix available)
    "RUSTSEC-2023-0071",
    # Transitive via yara-x -> wasmtime 43. YARA-X uses one process-wide rules
    # engine here, which the advisory identifies as unaffected; no compatible
    # patched Wasmtime release exists in YARA-X's current dependency range.
    "RUSTSEC-2026-0222",
    # Transitive via yara-x -> wasmtime. The vulnerable filesystem implementation
    # is in wasmtime-wasi, which is not present in the resolved dependency graph.
    "RUSTSEC-2026-0269",
]

[sources]
