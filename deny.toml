[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unlicense",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]

[advisories]
unused-ignored-advisory = "deny"
ignore = [
    # Chrono is unmaintained with no patched release (https://rustsec.org/advisories/RUSTSEC-2026-0543.html).
    # Third-party crates still depend on Chrono.
    # Remove this exception when Chrono is no longer listed in Cargo.lock.
    "RUSTSEC-2026-0543",
    # Transitive via yara-x -> bincode (unmaintained, no fix available)
    "RUSTSEC-2025-0141",
    # Transitive via yara-x -> rsa (timing side-channel, no fix available)
    "RUSTSEC-2023-0071",
]

[sources]
