name: CI

# One gate for the whole workspace, plus the main/tag release tail.
#
# Cache economics: GitHub scopes Actions caches so that a branch can *restore*
# from the default branch but never *write* into its scope. So the only runs
# that seed a shared cache are the ones on `main` — the push-to-main run and the
# nightly schedule (which also executes with github.ref == refs/heads/main).
# Every PR and merge-queue run restores those caches read-only via `save-if`,
# which keeps PR builds warm without each PR uploading its own multi-GB target
# dir and evicting main's entry from the 10 GB repo cache budget.
#
# The nightly run exists so the warm caches do not go stale (7-day eviction) on
# a quiet week, and so `cargo deny` re-checks an unchanged dependency set
# against a freshly published RustSec advisory DB.
on:
  push:
    branches: [main]
    tags: ['apps-v*']
  pull_request:
  merge_group:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR and merge-queue runs supersede themselves. Runs on main do not: each one
  # seeds the shared caches and may publish a release, so cancelling an
  # in-flight one on the next push would leave both jobs half-done.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Transient crates.io / static.rust-lang.org failures are the most common
  # non-deterministic CI failure; retry instead of burning a rerun.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  fmt:
    name: Format
    # Nothing to format-check on the nightly cache-warm run.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          components: rustfmt

      # Deliberately uncached: rustfmt parses, it does not compile, so a cache
      # restore would cost more than the check. This is the fast-fail signal.
      - name: Rust format check
        run: cargo fmt --all -- --check

  proto:
    name: Proto
    # `crates/schema/proto/buf.yaml` has been correct since the wire landed, but
    # nothing ever ran it: eleven hook crates and the harness all depend on this
    # schema and a rename could reach main unchallenged. Same fast-fail shape as
    # Format — no Rust toolchain, no cache, buf only parses.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99  # v1.50.0
        with:
          github_token: ${{ github.token }}

      - name: Buf lint
        run: buf lint
        working-directory: crates/schema/proto

      - name: Buf format check
        run: buf format --diff --exit-code
        working-directory: crates/schema/proto

      # CONTEXT: `buf breaking --against` is deliberately absent. It has no
      # baseline to compare against yet — main carries no .proto files, and this
      # branch introduced the wire wholesale. Add it in the first PR after this
      # one lands, when main is a meaningful baseline.

  lint:
    name: Lint
    # Runs on schedule too (default branch) to warm the shared `lint` cache.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: lint
          # A run that fails at clippy has still compiled every dependency;
          # save that work rather than making the next main run start cold.
          cache-on-failure: true
          # Only default-branch runs write the shared cache; PR and merge-queue
          # runs restore it read-only (see the cache note at the top).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        # `--all-features` is the gate CI enforces (see CLAUDE.md). `--locked`
        # keeps the resolved graph identical to Cargo.lock, so the cache key
        # cannot drift out from under a PR.
        run: cargo clippy --locked --all-features -- -D warnings

      # Doc links are deny-level in [workspace.lints.rustdoc], so this fails on
      # a stale [`Type`] reference. Kept in this job rather than split out: it
      # reuses the lint job's warm target dir instead of needing a third cache.
      - name: Doc links
        run: cargo doc --locked --no-deps --workspace

  test:
    name: Test
    # Runs on schedule too (default branch) to warm the shared `test` cache.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Separate from `lint`: the two build with different feature
          # unification, so sharing one key would thrash a single entry.
          shared-key: test
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Provider-gated integration tests are #[ignore]d and need a live model
      # provider; this run does not enable them.
      - name: Run cargo test
        run: cargo test --locked --workspace

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable

      # Prebuilt binary, no compile and no cargo-binstall bootstrap.
      #
      # CONTEXT: both pins are load-bearing. `tool: cargo-deny` (no version)
      # resolves to whatever `latest` meant in the *action's* bundled manifest,
      # so the stale v2.9.4 pin was installing cargo-deny 0.13.9 — which predates
      # the `[graph]` section deny.toml uses and failed to parse the config at
      # all. Pin the tool version too, so the scanner cannot drift with the action.
      - name: Install cargo-deny
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833  # v2.87.1
        with:
          tool: cargo-deny@0.19.0

      # `cargo deny check` runs advisories / bans / licenses / sources off
      # Cargo.lock — no workspace compile, so this job needs no Rust cache and
      # never sits on the critical path. Advisory ignores live in deny.toml.
      - name: Deny check
        run: cargo deny check

  build-apps:
    name: Build app binaries (${{ matrix.os }} - ${{ matrix.target }})
    # Push-only: a green PR must not publish. Covers both the rolling `latest`
    # prerelease from main and an explicit apps-v* tag — the tag arm was
    # previously unreachable because `on: push` did not include tags.
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
          || startsWith(github.ref, 'refs/tags/apps-v'))
    needs: [fmt, proto, lint, test, security]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: apps-${{ matrix.target }}
          cache-on-failure: true

      - name: Build binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p sondera

      - name: Create archive
        shell: bash
        run: |
          bundle="sondera-${{ matrix.target }}"
          mkdir -p "$bundle"
          cp "target/${{ matrix.target }}/release/sondera" "$bundle/"
          cp -R .sondera "$bundle/"
          cp README.md LICENSE "$bundle/"
          # README's links now resolve into docs/; ship it so they are not dead.
          cp -R docs "$bundle/"
          tar -czvf "$bundle.tar.gz" "$bundle"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: binaries-${{ matrix.target }}
          path: sondera-${{ matrix.target }}.*

  release-apps:
    name: Create GitHub Release for Apps
    needs: [build-apps]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Elevated for this job only; every other job runs read-only.
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          files: dist/*
          generate_release_notes: true
